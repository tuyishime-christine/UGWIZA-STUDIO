  <!-- ========== GALLERY HEADER ========== -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    const API_BASE = 'https://ugwiza-studio-backend.onrender.com/api';

    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      try {
        const res = await fetch(`${API_BASE}/gallery`);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const items = await res.json();
        if (items.length === 0) {
          grid.innerHTML = '<p class="text-center text-muted">No items yet. Check back soon!</p>';
          return;
        }
        let html = '';
        items.forEach(item => {
          const isVideo = item.type === 'video';
          const fileUrl = `${API_BASE.replace('/api', '')}${item.file_path}`;
          const media = isVideo
            ? `<video src="${fileUrl}" controls muted style="width:100%; height:250px; object-fit:cover; border-radius:10px;"></video>`
            : `<img src="${fileUrl}" alt="${item.title || 'Gallery'}" style="width:100%; height:250px; object-fit:cover; border-radius:10px;">`;
          html += `
            <div class="col-md-4 col-sm-6 gallery-item">
              ${media}
              <div class="gallery-overlay">
                <h5>${item.title || 'Untitled'}</h5>
                <p>${item.category || ''}</p>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch (err) {
        grid.innerHTML = `<p class="text-center text-danger">Failed to load gallery: ${err.message}</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
