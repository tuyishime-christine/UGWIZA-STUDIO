  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    const API_BASE = 'https://ugwiza-studio-backend.onrender.com/api';

    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      try {
        const res = await fetch(`${API_BASE}/gallery`);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const items = await res.json();
        if (items.length === 0) {
          grid.innerHTML = '<p class="text-center text-muted">No items yet. Check back soon!</p>';
          return;
        }
        let html = '';
        items.forEach(item => {
          const isVideo = item.type === 'video';
          const fileUrl = `${API_BASE.replace('/api', '')}${item.file_path}`;
          const media = isVideo
            ? `<video src="${fileUrl}" controls muted playsinline style="width:100%; height:auto; aspect-ratio:4/3; object-fit:cover; border-radius:10px;"></video>`
            : `<img src="${fileUrl}" alt="${item.title || 'Gallery'}" loading="lazy" style="width:100%; height:auto; aspect-ratio:4/3; object-fit:cover; border-radius:10px;" onerror="this.style.display='none'">`;
          html += `
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 gallery-item">
              <div class="gallery-card">
                ${media}
                <div class="gallery-overlay">
                  <h5>${item.title || 'Untitled'}</h5>
                  <p>${item.category || ''}</p>
                </div>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch (err) {
        grid.innerHTML = `<p class="text-center text-danger">Failed to load gallery: ${err.message}</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
